[package]
name = "snpanel-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The panel's HTTP API. Serves the routes it has ported and proxies the rest to the Python implementation."

[[bin]]
name = "snpanel-api"
path = "src/main.rs"

[dependencies]
snpanel-core = { path = "../snpanel-core" }
snpanel-db = { path = "../snpanel-db" }
snpanel-ipc = { path = "../snpanel-ipc" }
snpanel-nginx = { path = "../snpanel-nginx" }
# Reading a backup's manifest out of its archive.
tar.workspace = true
flate2.workspace = true
snpanel-osabi = { path = "../snpanel-osabi" }

anyhow.workspace = true
libc = "0.2"
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
redis.workspace = true
rand.workspace = true
base64.workspace = true
qrcode.workspace = true
image.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
x509-parser.workspace = true
axum-server.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
