[package]
name = "snpanel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared types, config and crypto for SNPanel. Compatibility layer with the Python implementation."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
aes.workspace = true
cbc.workspace = true
bcrypt.workspace = true
jsonwebtoken.workspace = true
totp-rs.workspace = true
rand.workspace = true
subtle.workspace = true
# Passkey (WebAuthn) signatures: ES256, RS256 and EdDSA. Pinned to the
# versions russh already brings in, so the lock gains no package; `rsa`
# carries its own SHA-256 for PKCS#1 v1.5.
p256 = "=0.14.0"
rsa = { version = "=0.10.0-rc.18", features = ["sha2"] }
ed25519-dalek = "=3.0.0"
