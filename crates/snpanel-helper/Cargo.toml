[package]
name = "snpanel-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The root-privileged helper. Every privileged operation the panel performs goes through here."

[[bin]]
name = "snpanel-helper"
path = "src/main.rs"

# Unpacks a customer's archive with no privileges at all. Separate from the
# helper on purpose: an archive is attacker-controlled input, so whatever
# parses it must not be the process running as root. The helper runs this one
# under `runuser` as the site's own user, which is what the bash does.
[[bin]]
name = "snpanel-extract"
path = "src/bin/snpanel-extract.rs"

[dependencies]
zip.workspace = true
tar.workspace = true
flate2.workspace = true
snpanel-core = { path = "../snpanel-core" }
snpanel-ipc = { path = "../snpanel-ipc" }
snpanel-osabi = { path = "../snpanel-osabi" }
anyhow.workspace = true
clap.workspace = true
libc = "0.2"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-journald.workspace = true

[dev-dependencies]
# So the include path can be checked against the thing that renders the
# `include` line, rather than against a literal in the same file.
snpanel-nginx = { path = "../snpanel-nginx" }
