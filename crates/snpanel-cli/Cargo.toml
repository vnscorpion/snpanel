[package]
name = "snpanel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `snpanel` command: SSH rescue menu, status and repair."

[[bin]]
name = "snpanel"
path = "src/main.rs"

[dependencies]
snpanel-core = { path = "../snpanel-core" }
snpanel-osabi = { path = "../snpanel-osabi" }
snpanel-ipc = { path = "../snpanel-ipc" }
# The deciding halves of the rescue-menu operations, with their golden
# fixtures: `ctl::passwords`, `ctl::panel_url`. Adds no external crate - this
# one depends on snpanel-core, snpanel-osabi and serde_json, all of which are
# already here.
snpanel-installer = { path = "../snpanel-installer" }
anyhow.workspace = true
clap.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
