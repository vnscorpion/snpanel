[package]
name = "snpanel-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The phases of a SNPanel installation, ported from installer/install.sh."

[dependencies]
snpanel-core = { path = "../snpanel-core" }
snpanel-osabi = { path = "../snpanel-osabi" }
# The update script's status file is JSON that the panel reads, and every
# write merges into whatever is already there rather than replacing it - so
# this side has to parse it, not only produce it.
serde_json.workspace = true
