<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- SNPANEL MANAGED
     CageFS dbus-hardening (cagefs-dbus-hardening.conf) denies every non-root
     account access to systemd over D-Bus. The panel runs as the system
     account "snpanel" (never a caged end user) and reads service state
     (`systemctl is-active`, `systemctl status`) for its dashboard and Services
     page. This allows exactly those READ calls; starting and stopping units
     still goes through the root helper. A user= policy outranks
     context="default", so this wins regardless of file order. -->
<busconfig>
  <policy user="snpanel">
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager" send_member="GetUnit"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager" send_member="LoadUnit"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager" send_member="ListUnitsByNames"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager" send_member="GetUnitProcesses"/>
  </policy>
</busconfig>
