# SNPANEL MANAGED - drop-in for lshttpd.service and httpd.service
# (/etc/systemd/system/<unit>.service.d/snpanel-weblogs.conf)
#
# Apache and LiteSpeed write the same per-site logs in /var/log/httpd.
# LiteSpeed opens them as its worker user (apache), and the directory ships
# 0700 root, so under LiteSpeed no site was logged at all - no access log for
# the customer, nothing for fail2ban. 0711 lets the workers reach the files
# without listing the directory; the files lose "other" read so one customer
# cannot read another's (each file's group is its customer). Set before every
# start, because an httpd update puts the directory back to 0700.
[Service]
ExecStartPre=/bin/sh -c 'chmod 0711 /var/log/httpd && find /var/log/httpd -maxdepth 1 -type f -name "*log" -exec chmod o-rwx {} +'
