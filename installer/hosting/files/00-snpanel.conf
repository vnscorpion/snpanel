# SNPANEL MANAGED - global Apache settings for the Hosting Edition.
# Ports are literals in 00-snpanel-listen.inc: LiteSpeed reads this
# configuration too and expands no Define/${VAR}.
Include /etc/httpd/conf.d/00-snpanel-listen.inc
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Include /etc/httpd/snpanel/00-tools.conf
IncludeOptional /etc/httpd/snpanel/sites/*.conf
