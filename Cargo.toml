[workspace]
resolver = "2"
members = [
    "crates/snpanel-core",
    "crates/snpanel-osabi",
    "crates/snpanel-ipc",
    "crates/snpanel-nginx",
    "crates/snpanel-cli",
    "crates/snpanel-db",
    "crates/snpanel-helper",
    "crates/snpanel-api",
    "xtask",
]

# Crates scaffolded but not yet implemented (Phase 2+). The directory layout
# matches RUST_MIGRATION_PLAN.md §4.1; each is added to `members` as its phase
# lands, so CI never spends time building an empty shell.
#   crates/snpanel-installer  Phase 4
#   crates/snpanel-daimport   Phase 5

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
# A short stable tag for a name rewritten out of a DirectAdmin
# backup, so two archives cannot collide. Never a security
# primitive - that is what `sha2` above is for.
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
bcrypt = "0.16"
jsonwebtoken = "9"
minijinja = "2"
# `otpauth` gives the issuer/account constructor and the provisioning URI;
# `gen_secret` gives Secret::generate_secret for new enrolments.
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Plan §5.1: the audit trail goes to journald natively, not via inherited
# stderr - the panel captures the helper's stderr, so stderr-only logging
# lives and dies inside one HTTP response.
tracing-journald = "0.3"
# Archive extraction for `site-archive-extract`. Both are used only by the
# unprivileged `snpanel-extract` binary, never by the helper itself: an
# archive is attacker-controlled input and a bug in a parser reading it must
# not be a bug running as root.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# The other three compressions a DirectAdmin backup arrives in. All three
# are **pure Rust and decompress-only**: nothing here links a C library,
# and nothing here can write an archive, which is the whole of what the
# importer needs. `tarfile.open(path, "r:*")` is what they stand in for.
bzip2-rs = "0.1"
lzma-rs = "0.3"
ruzstd = "0.9"
rand = "0.8"
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Redis is the production rate-limit backend (RATE_LIMIT_BACKEND=redis), and
# C9 needs the *same* counters Python uses, not a parallel set.
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# The 2FA enrolment QR, which Python builds with `qrcode` + Pillow.
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# TLS for the panel port: the Python terminates it itself (serve.py), so Rust
# in front of it has to as well.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
# Already in the lock file, pulled in by `axum-server` for the panel's own
# TLS. Declaring it here is what lets the one outbound HTTPS call - the
# Cloudflare API - reuse that stack instead of adding a second one.
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
x509-parser = "0.16"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
