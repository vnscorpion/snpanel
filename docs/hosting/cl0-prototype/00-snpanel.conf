# SNPANEL MANAGED - global Apache settings (CL-0 prototype)
# Listen ports live in 00-snpanel-listen.conf as literal numbers: LiteSpeed
# reads this configuration too and does not expand Define/${VAR}.
# Vhosts are <VirtualHost *> so they answer on whatever port Apache listens
# on - 80 when Apache is live, the standby port when LiteSpeed is.
Include /etc/httpd/conf.d/00-snpanel-listen.inc

ServerTokens Prod
ServerSignature Off
TraceEnable Off

Include /etc/httpd/snpanel/00-tools.conf
IncludeOptional /etc/httpd/snpanel/sites/*.conf
