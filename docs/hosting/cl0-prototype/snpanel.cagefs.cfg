[snpanel-cpapi]
comment=SNPanel CloudLinux integration: the domains script and its snapshot, needed by PHP Selector inside CageFS
paths=/usr/local/lib/snpanel/snpanel-cpapi, /opt/cpvendor/etc/integration.ini
# Installed as /etc/cagefs/conf.d/snpanel.cfg, then `cagefsctl --force-update`.
# The upgrade also runs `fc-cache -f` before that update: the Resource Usage
# charts are drawn inside the customer's cage, and without a current system
# font cache (/usr/lib/fontconfig/cache) fontconfig warns on stderr, which
# CloudLinux Manager merges into the JSON it parses ("received data is wrong").
