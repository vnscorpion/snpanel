# NT6: every change runs on all four target distributions.
#
# The matrix is switched on from Phase 0, before there is much to test, so that
# "make it work on Ubuntu first and sort the rest out later" is never an
# option. A distro-specific break shows up in the PR that caused it.

name: rust

on:
  push:
    branches: [main]
    paths: ['crates/**', 'xtask/**', 'Cargo.toml', 'Cargo.lock', 'tests/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'xtask/**', 'Cargo.toml', 'Cargo.lock', 'tests/**', '.github/workflows/rust.yml']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:24.04
          - debian:13
          - almalinux:10

    steps:
      - name: Install prerequisites (Debian family)
        if: startsWith(matrix.distro, 'ubuntu') || startsWith(matrix.distro, 'debian')
        run: |
          # python3 is needed by crates/snpanel-helper/tests/socket.rs, which
          # connects to the helper socket as an unprivileged user to check that
          # the peer-credential check refuses it. The AlmaLinux image ships
          # python3 already (dnf is written in it), so leaving it out here made
          # one matrix entry pass and the other two fail on a test that has
          # nothing to do with the distribution.
          #
          # Retried, because this has failed twice on
          #   E: Failed to fetch .../libexpat1_2.6.1-2ubuntu0.6_amd64.deb 404
          # with `apt-get update` run immediately before it. That is a mirror
          # serving an index for a `.deb` its pool does not have yet, which a
          # fresh update against a different CDN node clears. Three attempts,
          # then the job fails the way it always did - a retry loop that gave
          # up quietly would be worse than the flake.
          for attempt in 1 2 3; do
            apt-get update
            if apt-get install -y --no-install-recommends \
                 build-essential ca-certificates curl pkg-config git nftables python3; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying"
            sleep 10
          done
          echo "::error::apt failed three times"
          exit 1

      - name: Create the panel's service account (Debian family)
        if: startsWith(matrix.distro, 'ubuntu') || startsWith(matrix.distro, 'debian')
        # `snpanel-helper --serve` refuses to start without it: peercred's
        # PANEL_USER is the account it authorises, and there is nothing to
        # authorise against if it cannot be resolved. Without this the helper
        # socket tests take their skip branch and the privilege-boundary check
        # has never run - silently - in any job.
        run: useradd --system --no-create-home --shell /usr/sbin/nologin snpanel

      - name: Install prerequisites (RHEL family)
        if: startsWith(matrix.distro, 'almalinux')
        run: |
          dnf install -y gcc ca-certificates curl pkgconf-pkg-config git nftables shadow-utils

      - name: Create the panel's service account (RHEL family)
        if: startsWith(matrix.distro, 'almalinux')
        # Same reason as the Debian family: without this account the helper
        # will not serve and the socket tests skip rather than run.
        run: useradd --system --no-create-home --shell /sbin/nologin snpanel

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # C19 used to be a separate step here: `cargo xtask golden-nginx`
      # rendered the Jinja templates with minijinja and diffed them against
      # the output committed from the real Jinja2. The templates are Rust
      # now, so the same twenty captures are checked by
      # `every_captured_python_render_matches` in the step above - against the
      # code that actually runs, with nothing standing in the middle.

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  # The fixtures are the compatibility contract. If someone regenerates them
  # the diff must be deliberate and reviewed, so this checks that the committed
  # files still match what the current Python produces.
  fixtures:
    name: fixtures match Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The six libraries `tests/fixtures/generate.py` imports, pinned at
      # the versions `backend/requirements.txt` carried before the Python
      # panel was removed. The point of this job is to compare Rust against
      # what these exact releases produce, so "whatever is newest" would
      # quietly change what is being compared.
      - name: Install what the fixture generator imports
        run: |
          python -m venv .venv
          .venv/bin/pip install \
            cryptography==50.0.0 \
            bcrypt==4.0.1 \
            'passlib[bcrypt]==1.7.4' \
            'python-jose[cryptography]==3.5.0' \
            pyotp==2.9.0 \
            jinja2==3.1.6
      - name: Regenerate and compare
        run: |
          .venv/bin/python tests/fixtures/generate.py
          # bcrypt.json and fernet.json differ every run by design: one has a
          # random salt, the other a random IV and a timestamp. Everything else
          # is deterministic and must not drift - verified by generating twice
          # and diffing.
          # `tests/golden/nginx` is not in this list any more, and the
          # reason is worth writing down: `gen_nginx_golden` starts with
          # `from app.services import nginx`, and the Python backend is
          # deleted, so it prints SKIP and returns. Diffing a directory
          # nothing regenerated is a check that cannot fail. Those twenty
          # captures are still checked - against the Rust, by
          # `every_captured_python_render_matches` - which is the comparison
          # that was wanted and does not need an interpreter.
          git diff --exit-code -- \
            tests/fixtures/totp.json \
            tests/fixtures/jwt.json \
          || {
            echo "::error::Generated output no longer matches what is committed."
            echo "Review the diff above: a change here means the Python behaviour moved."
            exit 1
          }

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      # Ignoring exactly one advisory, for a crate that is not in any binary.
      # `rsa` is pulled into Cargo.lock by sqlx-mysql; snpanel-db takes sqlx
      # with default-features = false and the sqlite driver only, so
      # `cargo tree -i rsa --target all` prints nothing at all. cargo audit
      # reads the lockfile, which lists what could resolve rather than what
      # gets compiled, so it flags it anyway. There is no fixed version
      # published and nothing to switch to - the MySQL driver is already off.
      # Drop this the day sqlx stops locking it, or the day anything here
      # enables the MySQL driver, because then it stops being theoretical:
      #   RUSTSEC-2023-0071  rsa  Marvin Attack (no fixed version as of 2026-09-19)
      - run: cargo audit --ignore RUSTSEC-2023-0071
