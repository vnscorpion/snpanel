server {
    listen 80;
    server_name example.com www.example.com;
    root /home/u1/example.com/public_html;
    index index.php index.html index.htm;

    server_tokens off;
    disable_symlinks if_not_owner from=/home/u1/example.com;


    # SNPANEL HTTP FLOOD BEGIN
    limit_req zone=snpanel_flood_example_com burst=25;
    limit_conn snpanel_conn_flood 60;
    limit_req_status 429;
    limit_conn_status 429;
    # challenge
    set $x 1;
    # SNPANEL HTTP FLOOD END




    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log;

    client_max_body_size 1100M;

    # SNPANEL ACME CHALLENGE
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/snpanel-acme;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
        auth_basic off;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    autoindex off;

    location ~* \.(?:sql|bak|backup|old|orig|save|swp|swo|ini|log|conf|env|sh|inc)$ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }

    # SNPANEL CUSTOM INCLUDE
    include /etc/nginx/snpanel/custom/example.com.conf;


    location / {
        try_files $uri $uri/ @seohburl;
    }

    location @seohburl {
        rewrite ^/(.+)$ /index.php?/$1 last;
    }


    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires -1;
        access_log off;
    }
}