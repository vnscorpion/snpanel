server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    root /home/u1/example.com/public_html;

    server_tokens off;
    disable_symlinks if_not_owner from=/home/u1/example.com;


    # SNPANEL HTTP FLOOD BEGIN
    limit_req zone=snpanel_flood_example_com burst=25;
    limit_conn snpanel_conn_flood 60;
    limit_req_status 429;
    limit_conn_status 429;
    # challenge
    set $x 1;
    # SNPANEL HTTP FLOOD END



    # SNPANEL WAF BEGIN
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/sites/example.com.conf;
    # SNPANEL WAF END


    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log;

    client_max_body_size 1100M;

    # SNPANEL ACME CHALLENGE
    # Served from disk, ahead of the proxy, so certificate renewal never depends
    # on the application being up.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/snpanel-acme;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
        auth_basic off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    autoindex off;

    location ~ /\.(?!well-known) {
        deny all;
    }

    # SNPANEL CUSTOM INCLUDE
    include /etc/nginx/snpanel/custom/example.com.conf;

    # SNPANEL PROXY BEGIN
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade. $connection_upgrade comes from the map in
        # /etc/nginx/conf.d/00-snpanel-upgrade-map.conf.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_redirect off;
        # Off so server-sent events and long-polling reach the browser as they
        # happen instead of sitting in a buffer.
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    # SNPANEL PROXY END
}